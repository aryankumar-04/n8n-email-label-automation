name: Feature Request
description: Suggest an idea or enhancement for Email Lable Automation
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for contributing your ideas to make this workflow better!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the workflow node, logic, or behavior you would like to see.
    validations:
      required: true
